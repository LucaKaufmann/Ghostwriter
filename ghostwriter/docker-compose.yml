services:
  ghostwriter:
    image: "${GHOSTWRITER_IMAGE:-ghcr.io/lucakaufmann/ghostwriter}:${GHOSTWRITER_VERSION:-latest}"
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8080:8080"
    environment:
      DATA_DIR: /app/data
      OUTPUT_DIR: /app/output
      LOGS_DIR: /app/logs
    volumes:
      - ghostwriter_data:/app/data
      - ghostwriter_epubs:/app/output
      - ghostwriter_logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
  # Local Ollama sidecar (opt-in: docker compose --profile with-ollama up -d)
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    # Uncomment for NVIDIA GPU passthrough
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    profiles:
      - with-ollama

volumes:
  ghostwriter_data:
    name: ghostwriter_data
  ghostwriter_epubs:
    name: ghostwriter_epubs
  ghostwriter_logs:
    name: ghostwriter_logs
  ollama_data:
    name: ollama_data
