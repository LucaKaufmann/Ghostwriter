[project]
name = "ghostwriter"
version = "1.0.0"
description = "RSS digest generation service for Epilogue"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Epilogue Team"}
]
keywords = ["rss", "epub", "digest", "ai", "summarization"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: FastAPI",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP",
]

dependencies = [
    "fastapi>=0.109.0,<1.0.0",
    "uvicorn[standard]>=0.27.0,<1.0.0",
    "sqlmodel>=0.0.14,<1.0.0",
    "pydantic-settings>=2.1.0,<3.0.0",
    "litellm>=1.30.0,<2.0.0",
    "trafilatura>=1.8.0,<2.0.0",
    "feedparser>=6.0.10,<7.0.0",
    "ebooklib>=0.18,<1.0.0",
    "apscheduler>=3.10.0,<4.0.0",
    "httpx>=0.26.0,<1.0.0",
    "aiohttp>=3.9.0,<4.0.0",
    "h2>=4.1.0,<5.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0,<9.0.0",
    "pytest-asyncio>=0.23.0,<1.0.0",
    "ruff>=0.2.0",
    "mypy>=1.8.0",
]

[project.urls]
Homepage = "https://github.com/your-org/epilogue"
Documentation = "https://github.com/your-org/epilogue#readme"
Repository = "https://github.com/your-org/epilogue"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # Pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]
