name: Feed sync live contract

on:
  pull_request:
    paths:
      - ".github/workflows/feed-sync-live-contract.yml"
      - "scripts/verify-feed-sync-contract.py"
      - "shared/src/androidUnitTest/**"
      - "shared/src/androidMain/kotlin/com/example/epilogue/shared/ghostwriter/**"
      - "shared/src/commonMain/kotlin/com/example/epilogue/shared/ghostwriter/**"
      - "shared/src/commonMain/kotlin/com/example/epilogue/shared/sync/**"
      - "shared/build.gradle.kts"
      - "ghostwriter/app/**"
      - "ghostwriter/tests/fixtures/journey_*.py"
      - "ghostwriter/requirements.txt"
      - "ghostwriter/pyproject.toml"
      - "gradle/**"
      - "gradlew"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-contract:
    name: Real Ktor and FastAPI feed protocol
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;34.0.0"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ghostwriter/requirements.txt
      - name: Install native PDF and fixture dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core libgdk-pixbuf-2.0-0 libharfbuzz-subset0 libpango-1.0-0 libpangoft2-1.0-0
      - name: Install declared backend dependencies
        run: python -m pip install -r ghostwriter/requirements.txt
      - name: Run dedicated disposable live contract
        run: python scripts/verify-feed-sync-contract.py --python "$(command -v python)"
