name: Ghostwriter Live Journey

on:
  pull_request:
    paths:
      - "ghostwriter/app/**"
      - "ghostwriter/frontend/**"
      - "ghostwriter/tests/fixtures/journey_*.py"
      - "ghostwriter/requirements.txt"
      - "ghostwriter/pyproject.toml"
      - ".github/workflows/ghostwriter-journey.yml"
  workflow_dispatch:

concurrency:
  group: ghostwriter-journey-${{ github.ref }}
  cancel-in-progress: true

jobs:
  journey:
    name: Live reading and listening fixture journey
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ghostwriter/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ghostwriter/frontend/package-lock.json
      - name: Install PDF and fixture audio tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core libgdk-pixbuf-2.0-0 libharfbuzz-subset0 libpango-1.0-0 libpangoft2-1.0-0
      - name: Install declared backend dependencies
        run: python -m pip install -r ghostwriter/requirements.txt
      - name: Install locked frontend and browser dependencies
        working-directory: ghostwriter/frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run live fixture journey with isolated local backend
        working-directory: ghostwriter/frontend
        run: |
          JOURNEY_PYTHON="$(command -v python)" npm run test:e2e -- --config=tests/e2e/reading-listening.playwright.config.ts
      - name: Upload synthetic journey evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ghostwriter-live-journey
          path: ghostwriter/frontend/test-results/
          retention-days: 7
