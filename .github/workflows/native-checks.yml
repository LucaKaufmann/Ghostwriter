name: Native checks

on:
  pull_request:
    paths:
      - ".github/workflows/native-checks.yml"
      - "README.md"
      - "EpilogueIOS/**"
      - "app/**"
      - "shared/**"
      - "gradle/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Android and shared unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;34.0.0"
      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest :shared:testDebugUnitTest --no-daemon

  ios:
    name: iOS simulator build and unit tests
    runs-on: macos-15
    timeout-minutes: 60
    env:
      SIMULATOR_DESTINATION: platform=iOS Simulator,name=iPhone 16 Pro Max,OS=18.6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Select Xcode 26.3
        run: sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;34.0.0"
      - name: Install verified Tuist 4.152.0 release
        run: |
          curl -fL https://github.com/tuist/tuist/releases/download/4.152.0/tuist.zip -o "$RUNNER_TEMP/tuist.zip"
          echo 'bb5b8474d73ca97e2ffc2f6437bd93d75fe839be282fe8360b5568c50333799d  '"$RUNNER_TEMP/tuist.zip" | shasum -a 256 -c -
          mkdir -p "$RUNNER_TEMP/tuist"
          unzip -q "$RUNNER_TEMP/tuist.zip" -d "$RUNNER_TEMP/tuist"
          echo "$RUNNER_TEMP/tuist" >> "$GITHUB_PATH"
      - name: Report toolchain versions
        run: |
          java -version
          xcodebuild -version
          tuist version
      - name: Build shared XCFramework and generate workspace
        run: make -C EpilogueIOS setup
      - name: Build simulator app
        working-directory: EpilogueIOS
        run: |
          xcodebuild build \
            -workspace Epilogue.xcworkspace \
            -scheme Epilogue \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO
      - name: Verify requested simulator is installed
        run: |
          xcrun simctl list devices available -j | jq -e \
            '.devices["com.apple.CoreSimulator.SimRuntime.iOS-18-6"][] | select(.name == "iPhone 16 Pro Max" and .isAvailable == true)'
      - name: Run simulator unit tests
        working-directory: EpilogueIOS
        run: |
          xcodebuild test \
            -workspace Epilogue.xcworkspace \
            -scheme Epilogue-Workspace \
            -destination "$SIMULATOR_DESTINATION" \
            -skip-testing:EpilogueUITests \
            CODE_SIGNING_ALLOWED=NO
