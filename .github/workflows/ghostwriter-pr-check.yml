name: Ghostwriter PR Check

on:
  pull_request:
    paths:
      - "ghostwriter/**"
      - ".github/workflows/ghostwriter-pr-check.yml"
  workflow_dispatch:

concurrency:
  group: ghostwriter-pr-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ghostwriter/requirements.txt

      - name: Install PDF rendering libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            fonts-dejavu-core \
            libgdk-pixbuf-2.0-0 \
            libharfbuzz-subset0 \
            libpango-1.0-0 \
            libpangoft2-1.0-0

      - name: Install backend dependencies
        working-directory: ghostwriter
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run backend smoke tests
        working-directory: ghostwriter
        run: |
          python -m pytest -q \
            tests/test_health.py \
            tests/test_feeds.py \
            tests/test_auth_registration.py \
            tests/test_alembic_bootstrap.py \
            tests/test_podcast_multi_digest_migration.py \
            tests/test_digest_download_formats.py \
            tests/test_article_eligibility_filter.py \
            tests/test_markdown_utils.py \
            --durations=10

  frontend:
    name: Frontend check and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ghostwriter/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: ghostwriter/frontend
        run: npm ci

      - name: Check frontend
        working-directory: ghostwriter/frontend
        run: npm run check

      - name: Build frontend
        working-directory: ghostwriter/frontend
        run: npm run build
