name: Ghostwriter PR Check

on:
  pull_request:
    paths:
      - "ghostwriter/**"
      - "skills/ghostwriter-one-off-podcast/**"
      - ".github/workflows/ghostwriter-pr-check.yml"
  workflow_dispatch:

concurrency:
  group: ghostwriter-pr-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ghostwriter/requirements.txt

      - name: Install PDF rendering libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            fonts-dejavu-core \
            ffmpeg \
            libgdk-pixbuf-2.0-0 \
            libharfbuzz-subset0 \
            libpango-1.0-0 \
            libpangoft2-1.0-0

      - name: Install backend dependencies
        working-directory: ghostwriter
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run all backend regression tests
        working-directory: ghostwriter
        run: |
          PYTHONPATH="$(python -c 'import site; print(site.getsitepackages()[0])'):$PWD" \
            python -m pytest -q tests --durations=10

  one-off-podcast-helper:
    name: One-off podcast helper regressions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run helper transport regressions
        run: python -m unittest discover -s skills/ghostwriter-one-off-podcast/tests -p 'test_*.py' -v

  koreader-plugin:
    name: KOReader plugin host regressions
    runs-on: macos-15
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install LuaJIT
        run: brew install luajit

      - name: Run KOReader host regressions
        run: luajit ghostwriter/koreader/tests/run.lua

  frontend:
    name: Frontend check and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ghostwriter/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: ghostwriter/frontend
        run: npm ci

      - name: Check frontend
        working-directory: ghostwriter/frontend
        run: npm run check

      - name: Build frontend
        working-directory: ghostwriter/frontend
        run: npm run build
